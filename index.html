<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Mantenimiento | Tinta y Arte</title>
    <style>
        /* Reseteo básico y tipografía */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111111;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            overflow: hidden;
        }

        /* Contenedor principal con efecto cristal oscuro */
        .maintenance-container {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Animación del indicador "En vivo" */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 24px;
            color: #9ca3af;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444; /* Rojo para indicar trabajo en progreso */
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.2;
            background: linear-gradient(to right, #ffffff, #a3a3a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.125rem;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Botón de WhatsApp Premium */
        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25D366;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            padding: 16px 32px;
            border-radius: 9999px;
            font-size: 1.125rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(37, 211, 102, 0.39);
        }
        .cta-button:hover {
            transform: translateY(-2px);
            background-color: #22c55e;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        /* Responsivo para móviles */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .maintenance-container { padding: 30px 20px; }
            .cta-button { width: 100%; }
        }
    </style>
</head>
